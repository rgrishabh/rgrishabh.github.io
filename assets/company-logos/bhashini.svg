  <path d="M50 50 L50 8 A42 42 0 0 1 86.4 71 Z" fill="#FF7722"/>
  <!-- White/light segment -->
  <path d="M50 50 L86.4 71 A42 42 0 0 1 13.6 71 Z" fill="#E8E8E8"/>
  <!-- Green segment -->
  <path d="M50 50 L13.6 71 A42 42 0 0 1 50 8 Z" fill="#138808"/>
  <!-- Blue Ashoka-wheel style hub -->
  <circle cx="50" cy="50" r="14" fill="#000080"/>
  <circle cx="50" cy="50" r="8" fill="#fff"/>
  <!-- 12 spokes -->
  <g stroke="#000080" stroke-width="1.2" stroke-linecap="round">
    <line x1="50" y1="42" x2="50" y2="38"/>
    <line x1="56" y1="44" x2="59.2" y2="41"/>
    <line x1="58" y1="50" x2="62" y2="50"/>
    <line x1="56" y1="56" x2="59.2" y2="59"/>
    <line x1="50" y1="58" x2="50" y2="62"/>
    <line x1="44" y1="56" x2="40.8" y2="59"/>
    <line x1="42" y1="50" x2="38" y2="50"/>
    <line x1="44" y1="44" x2="40.8" y2="41"/>
    <line x1="52.8" y1="42.4" x2="54.4" y2="39.2"/>
    <line x1="57.6" y1="47.2" x2="60.8" y2="45.6"/>
    <line x1="57.6" y1="52.8" x2="60.8" y2="54.4"/>
    <line x1="52.8" y1="57.6" x2="54.4" y2="60.8"/>
  </g>
</svg>