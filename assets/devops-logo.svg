<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06090f"/>
      <stop offset="100%" stop-color="#0b1a2c"/>
    </linearGradient>
    <linearGradient id="cyn" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="grn" x1="0" y1="64" x2="64" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <!-- Subtle grid lines -->
  <line x1="0" y1="16" x2="64" y2="16" stroke="#06b6d4" stroke-width="0.35" stroke-opacity="0.25"/>
  <line x1="0" y1="32" x2="64" y2="32" stroke="#06b6d4" stroke-width="0.35" stroke-opacity="0.25"/>
  <line x1="0" y1="48" x2="64" y2="48" stroke="#06b6d4" stroke-width="0.35" stroke-opacity="0.25"/>
  <line x1="16" y1="0" x2="16" y2="64" stroke="#06b6d4" stroke-width="0.35" stroke-opacity="0.25"/>
  <line x1="32" y1="0" x2="32" y2="64" stroke="#06b6d4" stroke-width="0.35" stroke-opacity="0.25"/>
  <line x1="48" y1="0" x2="48" y2="64" stroke="#06b6d4" stroke-width="0.35" stroke-opacity="0.25"/>

  <!-- CI/CD pipeline track — horizontal backbone -->
  <line x1="8" y1="32" x2="56" y2="32" stroke="url(#cyn)" stroke-width="1.8" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Pipeline nodes (stages) -->
  <!-- Node 1: Source -->
  <circle cx="12" cy="32" r="3.5" fill="#06090f" stroke="url(#cyn)" stroke-width="1.8"/>
  <circle cx="12" cy="32" r="1.4" fill="#22d3ee"/>

  <!-- Node 2: Build -->
  <circle cx="27" cy="32" r="3.5" fill="#06090f" stroke="url(#cyn)" stroke-width="1.8"/>
  <circle cx="27" cy="32" r="1.4" fill="#22d3ee"/>

  <!-- Node 3: Deploy (green — success) -->
  <circle cx="42" cy="32" r="4.5" fill="#06090f" stroke="url(#grn)" stroke-width="2.2" filter="url(#glow)"/>
  <circle cx="42" cy="32" r="1.8" fill="#10b981"/>

  <!-- Arrow head at end -->
  <polyline points="50,28 56,32 50,36" stroke="url(#cyn)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none" filter="url(#glow)"/>

  <!-- Top branch — code commit line -->
  <polyline points="12,28.5 12,20 27,20 27,28.5" stroke="#06b6d4" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-opacity="0.7"/>

  <!-- Bottom branch — deploy/infra line -->
  <polyline points="27,35.5 27,44 42,44 42,36.5" stroke="#10b981" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-opacity="0.7"/>

  <!-- Kubernetes-style hexagon around deploy node hint -->
  <polygon points="42,22 47.2,25 47.2,31 42,34 36.8,31 36.8,25" fill="none" stroke="#10b981" stroke-width="1" stroke-opacity="0.4"/>
</svg>
