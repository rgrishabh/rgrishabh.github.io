<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="32" y2="32" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06090f"/>
      <stop offset="100%" stop-color="#0b1a2c"/>
    </linearGradient>
    <linearGradient id="cyn" x1="0" y1="0" x2="32" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- Pipeline backbone -->
  <line x1="4" y1="16" x2="28" y2="16" stroke="url(#cyn)" stroke-width="1.6" stroke-linecap="round"/>

  <!-- Stage 1 -->
  <circle cx="6" cy="16" r="2.2" fill="#06090f" stroke="#22d3ee" stroke-width="1.4"/>
  <circle cx="6" cy="16" r="0.85" fill="#22d3ee"/>

  <!-- Stage 2 -->
  <circle cx="14" cy="16" r="2.2" fill="#06090f" stroke="#22d3ee" stroke-width="1.4"/>
  <circle cx="14" cy="16" r="0.85" fill="#22d3ee"/>

  <!-- Stage 3 — deploy (green) -->
  <circle cx="22" cy="16" r="3" fill="#06090f" stroke="#10b981" stroke-width="1.8"/>
  <circle cx="22" cy="16" r="1.1" fill="#10b981"/>

  <!-- Arrow -->
  <polyline points="25.5,13.5 28.5,16 25.5,18.5" stroke="#06b6d4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Top branch line -->
  <polyline points="6,13.8 6,9 14,9 14,13.8" stroke="#06b6d4" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-opacity="0.65"/>

  <!-- Bottom branch line -->
  <polyline points="14,18.2 14,23 22,23 22,19" stroke="#10b981" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" fill="none" stroke-opacity="0.65"/>
</svg>
